name: token_social_sentiment
author: valory
version: 0.1.0
type: custom
description: 'Measures social sentiment about one token from X posts and news headlines.
  Input: JSON {"symbol", "address", "chain", "window_seconds"} (symbol or EVM address
  required) or free text such as "How is sentiment on $PEPE today?". Output: JSON
  with sentiment (-1 to 1, null below 5 on-topic items), breakdown counts, mentions,
  posts_analyzed, top_posts, headlines, reasoning, warnings, degraded_sources and
  error.'
license: Apache-2.0
aea_version: '>=1.0.0, <2.0.0'
fingerprint:
  __init__.py: bafybeiegmjh5poyo6gdpp5gbikh5boskzqfoltzk2ulkqawleroopfunui
  tests/__init__.py: bafybeihqccfy6wls7e2jtgik5ddrmwpek5rztrielunr4tn2mtigvby6tu
  tests/test_token_social_sentiment.py: bafybeibvqllwxj4p4p36w7fe5tfv2qg3otm7xfuboeqlh6na5hv3ldf5vi
  token_social_sentiment.py: bafybeigdj7ijlfbkgucjvywhr5lvoj3e6ravro52ddhzrfnqg667y3jfui
fingerprint_ignore_patterns: []
entry_point: token_social_sentiment.py
callable: run
params:
  default_model: gpt-4.1-2025-04-14
dependencies:
  openai:
    version: ==1.93.0
  pydantic:
    version: '>=2.0.0,<3.0.0'
  requests:
