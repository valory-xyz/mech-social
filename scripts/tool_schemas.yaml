# Input/output schemas published in metadata.json for each tool.
# `defaults` maps a kind to its schemas; `tool_kinds` maps every wire name
# (an entry of a tool's ALLOWED_TOOLS) to a kind. There is no fallback kind.
# The result description carries the output fields requesters need; each
# tool's module docstring has the full rules.

defaults:
  social_sentiment:
    input:
      type: text
      description: >-
        One token per request, named by the caller: a JSON object {"symbol",
        "address", "chain", "window_seconds"} with symbol or address required,
        or free text such as "How is sentiment on $PEPE today?". An EVM address
        gives the most exact answer. window_seconds defaults to 86400 (24 h)
        and is clamped to 3600..604740, so ask for 3600 for "right now" and
        604740 for a week; in free text an explicit period such as "over the
        past week" or "last 3 days" sets it. The tool does not discover or rank tokens, does not
        answer questions about several tokens, and returns no list of scam or
        rug-pull warnings: it measures the sentiment of the token named in the
        request over the window.
    output:
      type: object
      description: A JSON object containing the social sentiment for the token
      schema:
        type: object
        properties:
          requestId:
            type: integer
            description: Unique identifier for the request
          result:
            type: string
            description: >-
              Result in JSON format as a string, always with every key.
              sentiment: (bullish - bearish) / on-topic sample items, -1 to 1,
              null below 5 on-topic items.
              sentiment_interval: {"low": x, "high": y}, a 95% confidence
              interval for the mean of this sample: when two readings'
              intervals do not overlap the difference is likely real, and
              overlap does not show they agree; not the range a rerun would
              land in; null when sentiment is null. breakdown: number of on-topic sample
              items (posts plus headlines) per class, not mentions. mentions:
              all X posts matching the search in the window, spam included
              (bot templates are excluded in the search itself).
              mentions_trend: {"recent": n, "previous": m}, the matching posts
              in the newer and the older half of the window; null when the
              count is unavailable, when the window is under 4 hours, and when
              the hourly buckets cover too little of it (then degraded_sources
              carries "x_trend").
              posts_analyzed: on-topic X posts in the sample (at most 40).
              warnings: list of {type, message}, type symbol_mismatch,
              chain_mismatch, symbol_unverified, address_not_listed or
              busier_token_same_ticker (a thin or unlisted address; the
              message names the token with the most DEX volume for the ticker).
              degraded_sources: sources that failed while a result was still
              produced (x, x_partial, x_counts, x_trend, news, dexscreener). error: null
              or {type, message}, type invalid_input, source_unavailable,
              llm_error or internal.
            example: |-
              {
                "token": "ABC",
                "address": "0x1111111111111111111111111111111111111111",
                "chain": "base",
                "window_seconds": 86400,
                "sentiment": 0.5,
                "sentiment_interval": {"low": 0.07, "high": 0.93},
                "mentions": 1250,
                "mentions_trend": {"recent": 800, "previous": 450},
                "posts_analyzed": 9,
                "breakdown": {"bullish": 6, "neutral": 3, "bearish": 1},
                "reasoning": "Most on-topic posts react positively to a new exchange listing.",
                "top_posts": [
                  "https://x.com/i/web/status/1000000000000000001",
                  "https://x.com/i/web/status/1000000000000000002",
                  "https://x.com/i/web/status/1000000000000000003",
                  "https://x.com/i/web/status/1000000000000000004",
                  "https://x.com/i/web/status/1000000000000000005"
                ],
                "headlines": [{"title": "ABC lists on a new exchange", "url": "https://example.com/abc"}],
                "warnings": [],
                "degraded_sources": [],
                "error": null
              }
          prompt:
            type: string
            description: The prompt passed to the tool.
        required:
          - requestId
          - result
          - prompt

tool_kinds:
  token_social_sentiment: social_sentiment
